name: Release

# Tag pushes (v*) build every non-Apple artifact and attach them to a DRAFT
# release. workflow_dispatch runs the same builds and stops at workflow
# artifacts — use it to validate the pipeline or grab a pre-release exe zip.
#
# Deliberately NOT built here:
# - The macOS app: Developer ID signing + notarization run locally
#   (client/nod-apple/scripts/release-macos); the DMG is uploaded to the same
#   draft release by hand, and its checksum appended to SHA256SUMS.
# - Windows/Linux signing: v1 ships unsigned; the SmartScreen flow and
#   checksum verification are documented in the release notes. The desktop
#   app ships as a zipped exe, not an installer, by design.
# - Linux desktop bundles: deferred until there's a Linux test environment.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  server-tui:
    name: server+tui (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: System deps (keyring needs libdbus)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: System deps (vendored OpenSSL needs nasm on MSVC)
        if: runner.os == 'Windows'
        run: choco install nasm -y && echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # vendored-openssl statically builds appattest's OpenSSL so the release
      # binaries run without a system libssl on any of the five targets.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p nod-server -p nod-tui -p nod-verify --features nod-server/vendored-openssl
      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist
          for bin in nod-server nod-tui nod-verify; do
            if [ "${{ runner.os }}" = "Windows" ]; then
              7z a "dist/${bin}-${VERSION}-${{ matrix.target }}.zip" "./target/${{ matrix.target }}/release/${bin}.exe" > /dev/null
            else
              tar -C "target/${{ matrix.target }}/release" -czf "dist/${bin}-${VERSION}-${{ matrix.target }}.tar.gz" "${bin}"
            fi
          done
          ls -l dist/
      - uses: actions/upload-artifact@v5
        with:
          name: server-tui-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows-desktop:
    name: desktop exe (unsigned, zipped)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-desktop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/nod-desktop/package-lock.json
      # A bare zipped exe instead of an installer: WebView2 ships with
      # Windows 10/11, the exe is self-contained, and users put it wherever
      # they want.
      - name: Build exe
        working-directory: client/nod-desktop
        run: |
          npm ci
          npm run tauri build -- --no-bundle
      - name: Zip exe
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          [ "${GITHUB_REF_TYPE}" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p dist stage
          SEARCH_ROOTS=()
          for root in client/nod-desktop/src-tauri/target client/nod-desktop/target target; do
            [ -d "$root" ] && SEARCH_ROOTS+=("$root")
          done
          if [ "${#SEARCH_ROOTS[@]}" -eq 0 ]; then
            echo "No target directories found after Tauri build." >&2
            exit 1
          fi
          mapfile -t EXE_CANDIDATES < <(
            find "${SEARCH_ROOTS[@]}" -type f -path '*/release/*' \
              \( -iname 'Nod.exe' -o -iname 'nod-desktop.exe' \) | sort
          )
          if [ "${#EXE_CANDIDATES[@]}" -eq 0 ]; then
            echo "No release exe found. Candidate exe files:" >&2
            find "${SEARCH_ROOTS[@]}" -type f -iname '*.exe' -print | sort >&2
            exit 1
          fi
          EXE="${EXE_CANDIDATES[0]}"
          echo "Packaging $EXE"
          cp "$EXE" stage/Nod.exe
          7z a "dist/nod-desktop-${VERSION}-x86_64-pc-windows-msvc.zip" ./stage/Nod.exe > /dev/null
          ls -l dist/
      - uses: actions/upload-artifact@v5
        with:
          name: windows-desktop
          path: dist/*.zip
          if-no-files-found: error

  docker:
    name: server image (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        env:
          # The build-record artifact this uploads breaks the release job's
          # download-everything step (corrupt zip); we don't need it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: server/nod-server/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/nod-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/nod-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: draft release
    if: github.ref_type == 'tag'
    needs: [server-tui, windows-desktop, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Release body
        id: body
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "Release notes missing at $NOTES — drafting with a placeholder." >&2
            echo "Release notes pending." > /tmp/placeholder.md
            echo "path=/tmp/placeholder.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Nod ${{ github.ref_name }}
          body_path: ${{ steps.body.outputs.path }}
          files: dist/*
